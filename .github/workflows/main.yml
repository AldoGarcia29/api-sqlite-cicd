name: CI API SQLite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas y cobertura
        run: npm run coverage

  build-and-push:
    name: Construir y publicar imagen
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-sqlite-cicd:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api-sqlite-cicd:${{ github.sha }}

  deploy:
    name: Desplegar API en EC2
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Desplegar mediante SSH
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_FINGERPRINT: ${{ secrets.EC2_FINGERPRINT }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH_DIR=$(mktemp -d)
          trap 'rm -rf "$SSH_DIR"' EXIT

          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$SSH_DIR/key.pem"
          chmod 600 "$SSH_DIR/key.pem"

          ssh-keyscan -T 15 -t ed25519 "$EC2_HOST" \
            > "$SSH_DIR/known_hosts" 2>/dev/null

          ACTUAL=$(ssh-keygen -lf "$SSH_DIR/known_hosts" -E sha256 | awk '{print $2}')
          EXPECTED=$(printf '%s' "$EC2_FINGERPRINT" | tr -d '\r\n')

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "La huella ED25519 no coincide con el Secret."
            exit 1
          fi

          IMAGE="${DOCKERHUB_USERNAME}/api-sqlite-cicd:${COMMIT_SHA}"

          if [[ ! "$IMAGE" =~ ^[a-z0-9_-]+/api-sqlite-cicd:[a-f0-9]{40}$ ]]; then
            echo "El nombre de imagen o el hash no es valido."
            exit 1
          fi

          bash -n scripts/deploy.sh

          ssh \
            -i "$SSH_DIR/key.pem" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "$EC2_USER@$EC2_HOST" \
            "sudo -n bash -s -- '$IMAGE'" \
            < scripts/deploy.sh